<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34e2e2"/>
      <stop offset="1" stop-color="#0aa2c0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#f07f2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- falling notes -->
  <rect x="78" y="60" width="52" height="120" rx="14" fill="url(#teal)"/>
  <rect x="160" y="140" width="52" height="90" rx="14" fill="url(#orange)"/>
  <rect x="242" y="52" width="52" height="150" rx="14" fill="url(#teal)"/>
  <rect x="324" y="120" width="52" height="110" rx="14" fill="url(#teal)"/>
  <rect x="398" y="76" width="40" height="86" rx="12" fill="url(#orange)"/>
  <!-- hit line -->
  <rect x="48" y="300" width="416" height="8" rx="4" fill="#8be9fd" opacity="0.9"/>
  <!-- keyboard -->
  <g>
    <rect x="48" y="316" width="416" height="148" rx="16" fill="#f4f6fb"/>
    <rect x="107" y="316" width="8" height="148" fill="#0b0f1a" opacity="0.18"/>
    <rect x="166" y="316" width="8" height="148" fill="#0b0f1a" opacity="0.18"/>
    <rect x="225" y="316" width="8" height="148" fill="#0b0f1a" opacity="0.18"/>
    <rect x="284" y="316" width="8" height="148" fill="#0b0f1a" opacity="0.18"/>
    <rect x="343" y="316" width="8" height="148" fill="#0b0f1a" opacity="0.18"/>
    <rect x="402" y="316" width="8" height="148" fill="#0b0f1a" opacity="0.18"/>
    <rect x="88" y="316" width="46" height="92" rx="8" fill="#141b2b"/>
    <rect x="147" y="316" width="46" height="92" rx="8" fill="#141b2b"/>
    <rect x="265" y="316" width="46" height="92" rx="8" fill="#141b2b"/>
    <rect x="324" y="316" width="46" height="92" rx="8" fill="#141b2b"/>
    <rect x="383" y="316" width="46" height="92" rx="8" fill="#141b2b"/>
    <!-- lit key under the tallest note -->
    <rect x="233" y="316" width="50" height="148" rx="10" fill="url(#teal)" opacity="0.85"/>
  </g>
</svg>
